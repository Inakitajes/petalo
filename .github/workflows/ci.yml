name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift run petalo-tests
      - name: Validate resources
        run: |
          plutil -lint config/Info.plist
          for script in scripts/*.sh; do /bin/sh -n "$script"; done
      - name: Package local app
        run: ./scripts/build-app.sh
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict .build/Petalo.app
          test -x .build/Petalo.app/Contents/MacOS/Petalo
          test -f .build/Petalo.app/Contents/Resources/default.metallib
